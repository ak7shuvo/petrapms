name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: propetra
          POSTGRES_PASSWORD: propetra
          POSTGRES_DB: propetra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://propetra:propetra@localhost:5432/propetra_test
      JWT_ACCESS_SECRET: ci-test-secret-not-for-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      WEB_ORIGIN: http://localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit (high/critical only; documented exceptions in docs/SECURITY-ARCHITECTURE.md)
        run: npm audit --omit=dev --audit-level=high || true
      - name: Apply migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
      - name: Seed permission catalog
        working-directory: apps/api
        run: npx prisma db seed
      - name: Lint
        run: npm run lint --workspace=apps/api
      - name: Build API
        run: npm run build --workspace=apps/api
      - name: Build Web
        run: npm run build --workspace=apps/web
      - name: Run e2e tests
        working-directory: apps/api
        run: npm run test:e2e

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Create .env for compose
        run: |
          cp .env.example .env
          sed -i 's/^JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=ci-docker-test-secret-not-for-production-please/' .env
      - name: Build all images
        run: docker compose build
      - name: Start stack
        # Phase 10: the api container's entrypoint now runs `prisma
        # migrate deploy` + seed itself on boot (see apps/api/Dockerfile),
        # so no separate migration/seed step is needed here — just wait
        # for it to finish and report healthy.
        run: docker compose up -d
      - name: Wait for API health endpoint (reporting DB connected)
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3001/v1/health | grep -q '"database":"connected"'; then
              exit 0
            fi
            sleep 3
          done
          echo "API never reported a connected database within the timeout" && exit 1
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
